name: Build and deploy Binary Star

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: '4.7.2'
  INK_VERSION: '1.2.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Godot and Ink
        id: tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/binary-star-tools
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: binary-star-linux-x64-godot-${{ env.GODOT_VERSION }}-ink-${{ env.INK_VERSION }}-v1

      - name: Install official Godot and Ink releases
        if: steps.tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/binary-star-tools"
          download_dir="$RUNNER_TEMP/binary-star-downloads"
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$tool_dir/ink" "$download_dir" "$template_dir"
          cd "$download_dir"

          release_url="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable"
          editor_zip="Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          template_zip="Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          curl --fail --location --retry 3 --output "$editor_zip" "$release_url/$editor_zip"
          curl --fail --location --retry 3 --output "$template_zip" "$release_url/$template_zip"
          curl --fail --location --retry 3 --output SHA512-SUMS.txt "$release_url/SHA512-SUMS.txt"
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q "$editor_zip" -d "$tool_dir"
          mv "$tool_dir/Godot_v$GODOT_VERSION-stable_linux.x86_64" "$tool_dir/godot"
          unzip -j -q "$template_zip" 'templates/web_nothreads_release.zip' -d "$template_dir"
          chmod +x "$tool_dir/godot"

          curl --fail --location --retry 3 --output inklecate.zip \
            "https://github.com/inkle/ink/releases/download/v$INK_VERSION/inklecate_linux.zip"
          unzip -q inklecate.zip -d "$tool_dir/ink"
          chmod +x "$tool_dir/ink/inklecate"

      - name: Add tools to PATH
        shell: bash
        run: |
          printf '%s\n' "$RUNNER_TEMP/binary-star-tools" "$RUNNER_TEMP/binary-star-tools/ink" >> "$GITHUB_PATH"

      - name: Compile the current dialogue and test fixtures
        run: |
          inklecate -o Assets/Ink/BinaryStar.json Assets/Ink/BinaryStar.ink
          inklecate -o tests/fixtures/empathy.json tests/fixtures/empathy.ink
          inklecate -o tests/fixtures/choice_preview.json tests/fixtures/choice_preview.ink

      - name: Import Godot resources
        run: godot --headless --path . --editor --import

      - name: Check story routes and game behavior
        run: godot --headless --path . --script tests/run_tests.gd

      - name: Export the browser game and iframe page
        run: |
          mkdir -p builds/web/game
          godot --headless --path . --export-release Web builds/web/game/index.html
          cp web/index.html builds/web/index.html
          touch builds/web/.nojekyll
          test -s builds/web/game/index.html
          test -s builds/web/game/index.js
          test -s builds/web/game/index.wasm
          test -s builds/web/game/index.pck

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: builds/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
