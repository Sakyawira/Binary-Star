[preset.0]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="Assets/Ink/BinaryStar.json,addons/inkgd/LICENSE,Assets/Fonts & Materials/JetBrainsMono/OFL.txt"
exclude_filter="tests/*,test-results/*,builds/*,tools/*,docs/*,*.meta,*.asset,*.unity,*.cs,Packages/*,ProjectSettings/*"
export_path="builds/BinaryStar.zip"
script_export_mode=2

[preset.0.options]
export/distribution_type=1
binary_format/architecture="universal"
application/bundle_identifier="com.sakyawira.binarystar"
application/short_version="1.0.0"
application/version="1.0.0"
codesign/codesign=0

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="Assets/Ink/BinaryStar.json,addons/inkgd/LICENSE,Assets/Fonts & Materials/JetBrainsMono/OFL.txt"
exclude_filter="tests/*,test-results/*,builds/*,tools/*,docs/*,*.meta,*.asset,*.unity,*.cs,Packages/*,ProjectSettings/*"
export_path="builds/BinaryStar.exe"
script_export_mode=2

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.2]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="Assets/Ink/BinaryStar.json,addons/inkgd/LICENSE,Assets/Fonts & Materials/JetBrainsMono/OFL.txt"
exclude_filter="tests/*,test-results/*,builds/*,tools/*,docs/*,*.meta,*.asset,*.unity,*.cs,Packages/*,ProjectSettings/*"
export_path="builds/BinaryStar.x86_64"
script_export_mode=2

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.3]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="Assets/Ink/BinaryStar.json,addons/inkgd/LICENSE,Assets/Fonts & Materials/JetBrainsMono/OFL.txt"
exclude_filter="tests/*,test-results/*,builds/*,tools/*,docs/*,web/*,*.meta,*.asset,*.unity,*.cs,Packages/*,ProjectSettings/*"
export_path="builds/web/game/index.html"
script_export_mode=2

[preset.3.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"theme-color\" content=\"#031333\">"
progressive_web_app/enabled=false
